<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Médico | Inovare</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module">
    // Proteção de rota imediata no head para evitar FOUC
    const usuario = JSON.parse(sessionStorage.getItem('usuarioLogado'));
    if (!usuario || usuario.perfil !== 'medico') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <img src="http://inovare.med.br/wp-content/uploads/2023/01/Logo.png" alt="Inovare Serviços de Saúde" class="logo-img" style="max-height: 40px;">
    </div>
  </header>

  <main class="container">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h2>Olá, <span id="user-name">Dr(a)</span>!</h2>
        <button id="btn-logout" class="btn-logout">Sair</button>
      </div>

      <div class="card">
        <h3>Dados de Identificação</h3>
        <p><strong>Nome:</strong> <span id="display-name">Carregando...</span></p>
        <p><strong>E-mail:</strong> <span id="display-email">Carregando...</span></p>
        <p><strong>Especialidade:</strong> <span id="display-specialty">Carregando...</span></p>
      </div>
    </div>
  </main>

  <script type="module">
    // Carregar dados dinâmicos do usuário
    const usuario = JSON.parse(sessionStorage.getItem('usuarioLogado'));
    if (usuario) {
      document.getElementById('user-name').textContent = usuario.nome;
      document.getElementById('display-name').textContent = usuario.nome;
      document.getElementById('display-email').textContent = usuario.email;
      document.getElementById('display-specialty').textContent = usuario.especialidade || 'N/A';
    }

    // Funcionalidade de Logout
    document.getElementById('btn-logout').addEventListener('click', () => {
      sessionStorage.removeItem('usuarioLogado');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
