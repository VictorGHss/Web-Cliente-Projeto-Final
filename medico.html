<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Médico | Inovare</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module">
    // Proteção de rota imediata no head em escopo isolado para evitar erros de re-declaração
    {
      const usuario = JSON.parse(sessionStorage.getItem('usuarioLogado'));
      if (!usuario || usuario.perfil !== 'medico') {
        window.location.href = 'index.html';
      }
    }
  </script>
</head>
<body>

  <!-- Cabeçalho com Logo, Nome do Médico/Especialidade e Logout -->
  <header class="main-header" role="banner">
    <div class="header-container" style="display: flex; align-items: center; justify-content: space-between;">
      <img src="http://inovare.med.br/wp-content/uploads/2023/01/Logo.png" alt="Inovare Serviços de Saúde" class="logo-img" style="max-height: 40px; margin: 0;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="doctor-info">Carregando...</span>
        <button id="btn-logout" class="btn-logout">Sair</button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container" id="main-content">
    
    <section class="appointments-section" aria-labelledby="appointments-title">
      <h2 id="appointments-title">Agenda de Atendimentos</h2>
      
      <!-- Container Responsivo da Tabela -->
      <div id="table-wrapper" class="table-responsive" style="display: none;">
        <table class="appointments-table" id="appointments-table">
          <thead>
            <tr>
              <th scope="col">Paciente</th>
              <th scope="col">Data</th>
              <th scope="col">Horário</th>
              <th scope="col">Status Atual</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="appointments-tbody">
            <!-- Linhas de consultas geradas dinamicamente via JS -->
          </tbody>
          <tfoot>
            <tr>
              <td colspan="5" id="appointments-total" style="text-align: right;">
                Total de atendimentos: 0
              </td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Mensagem amigável alternativa caso não haja consultas -->
      <p id="empty-appointments" class="empty-message" style="display: none;">
        Você não possui consultas agendadas no momento.
      </p>

    </section>

  </main>

  <!-- Rodapé Padronizado -->
  <footer class="main-footer" role="contentinfo">
    <div class="container">
      <p>R. Carlos Osternack, 111 - Estrela, Ponta Grossa - PR, 84040-120 | Telefone: (42) 3026-2600</p>
    </div>
  </footer>

  <!-- Script Principal do Painel do Médico -->
  <script type="module" src="js/medico.js"></script>
</body>
</html>
